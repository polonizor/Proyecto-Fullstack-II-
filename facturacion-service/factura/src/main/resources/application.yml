server:
  port: 8089

spring:
  application:
    name: facturacion-service
  datasource:
    url: jdbc:mysql://localhost:3306/factura_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: INFO
    com.hospitaltech_cl: DEBUG