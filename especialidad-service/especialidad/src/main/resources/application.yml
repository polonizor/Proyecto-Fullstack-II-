server:
  port: 8084

spring:
  application:
    name: especialidad-service
  datasource:
    url: jdbc:mysql://localhost:3306/especialidad_db
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
