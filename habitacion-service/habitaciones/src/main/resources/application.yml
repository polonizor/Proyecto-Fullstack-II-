server:
  port: 8090

spring:
  application:
    name: habitaciones-service
  datasource:
    url: jdbc:mysql://localhost:3306/habitacion_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    root: INFO
    com.hospitaltech_cl: DEBUG
