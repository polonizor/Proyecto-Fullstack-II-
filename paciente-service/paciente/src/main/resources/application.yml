spring:
  datasource:
    url: jdbc:mysql://localhost:3306/paciente_db
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  application:
    name: paciente-service

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
