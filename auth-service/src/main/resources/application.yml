spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
  
  application:
    name: auth-service

server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
